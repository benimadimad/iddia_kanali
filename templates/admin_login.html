<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Yönetici girişi · {{ league_name }}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="auth-body">
  <main class="auth-card">
    <a class="auth-brand" href="/">
      <span class="auth-mark">11</span>
      <span><strong>{{ league_name }}</strong><small>Yönetici paneli</small></span>
    </a>
    <div class="auth-copy">
      <p class="eyebrow">Özel alan</p>
      <h1>Tahminleri yönet</h1>
      <p>Bu panel yalnızca lig yöneticisi içindir. Herkese açık sayfa salt okunurdur.</p>
    </div>
    {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('admin_login_post') }}">
      <label for="password">Yönetici şifresi</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Giriş yap</button>
    </form>
    <a class="back-link" href="/">← Herkese açık sayfaya dön</a>
  </main>
</body>
</html>
